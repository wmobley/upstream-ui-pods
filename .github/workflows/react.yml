name: React CI/CD

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main, 'feature/**']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to Tapis Pods (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAPIS_SERVICE_USERNAME: ${{ secrets.TAPIS_USERNAME }}
          TAPIS_SERVICE_PASSWORD: ${{ secrets.TAPIS_PASSWORD }}
          TAPIS_BASE_URL: https://portals.tapis.io
          TAPIS_POD_ID: upstream
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="ghcr.io/${{ github.repository }}:sha-${SHORT_SHA}"

          TAPIS_TOKEN=$(curl -sf -X POST "${TAPIS_BASE_URL}/v3/oauth2/tokens" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${TAPIS_SERVICE_USERNAME}\",\"password\":\"${TAPIS_SERVICE_PASSWORD}\",\"grant_type\":\"password\"}" \
            | jq -r '.result.access_token.access_token')
          if [ -z "$TAPIS_TOKEN" ] || [ "$TAPIS_TOKEN" = "null" ]; then
            echo "ERROR: Failed to obtain Tapis token" && exit 1
          fi

          POD=$(curl -sf "${TAPIS_BASE_URL}/v3/pods/${TAPIS_POD_ID}" \
            -H "X-Tapis-Token: ${TAPIS_TOKEN}" | jq '.result')

          PAYLOAD=$(echo "$POD" | jq --arg img "$IMAGE" '{
            image: $img,
            description: .description,
            command: .command,
            arguments: .arguments,
            environment_variables: (.environment_variables // {}),
            secret_map: (.secret_map // {}),
            status_requested: "RESTART",
            volume_mounts: (.volume_mounts // {}),
            time_to_stop_default: (.time_to_stop_default // -1),
            time_to_stop_instance: .time_to_stop_instance,
            networking: (.networking // {}),
            resources: (.resources // {}),
            compute_queue: (.compute_queue // "default")
          }')

          STATUS=$(curl -sf -X PUT "${TAPIS_BASE_URL}/v3/pods/${TAPIS_POD_ID}" \
            -H "X-Tapis-Token: ${TAPIS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" | jq -r '.status')
          echo "Tapis Pods update status: ${STATUS}"

  deploy-develop:
    needs: build
    if: startsWith(github.ref, 'refs/heads/feature/') && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: Tapis Configure
    env:
      TAPIS_SERVICE_USERNAME: ${{ secrets.TAPIS_DEVELOP_USERNAME }}
      TAPIS_SERVICE_PASSWORD: ${{ secrets.TAPIS_DEVELOP_PASSWORD }}
      TAPIS_BASE_URL: https://portals.tapis.io
      TAPIS_POD_ID: upstreamdevelop

    steps:
      - name: Deploy to Tapis Pods (develop)
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:sha-${{ needs.build.outputs.short_sha }}"

          TAPIS_TOKEN=$(curl -sf -X POST "${TAPIS_BASE_URL}/v3/oauth2/tokens" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${TAPIS_SERVICE_USERNAME}\",\"password\":\"${TAPIS_SERVICE_PASSWORD}\",\"grant_type\":\"password\"}" \
            | jq -r '.result.access_token.access_token')
          if [ -z "$TAPIS_TOKEN" ] || [ "$TAPIS_TOKEN" = "null" ]; then
            echo "ERROR: Failed to obtain Tapis token from ${TAPIS_BASE_URL}" && exit 1
          fi

          POD=$(curl -sf "${TAPIS_BASE_URL}/v3/pods/${TAPIS_POD_ID}" \
            -H "X-Tapis-Token: ${TAPIS_TOKEN}" | jq '.result')

          CLIENT_ID="upstream-develop"
          PAYLOAD=$(echo "$POD" | jq --arg img "$IMAGE" --arg client_id "$CLIENT_ID" '{
            image: $img,
            description: .description,
            command: .command,
            arguments: .arguments,
            environment_variables: ((.environment_variables // {}) + {VITE_TAPIS_OAUTH_CLIENT_ID: $client_id}),
            secret_map: (.secret_map // {}),
            status_requested: "RESTART",
            volume_mounts: (.volume_mounts // {}),
            time_to_stop_default: (.time_to_stop_default // -1),
            time_to_stop_instance: .time_to_stop_instance,
            networking: (.networking // {}),
            resources: (.resources // {}),
            compute_queue: (.compute_queue // "default")
          }')

          STATUS=$(curl -sf -X PUT "${TAPIS_BASE_URL}/v3/pods/${TAPIS_POD_ID}" \
            -H "X-Tapis-Token: ${TAPIS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" | jq -r '.status')
          echo "Tapis Pods update status: ${STATUS}"
