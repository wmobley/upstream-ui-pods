# Crawlers/scrapers that are known to ignore robots.txt Disallow. Blocked
# outright rather than relying on politeness, since robots.txt only asks.
map $http_user_agent $blocked_ua {
    default 0;
    ~*Bytespider 1;
    ~*SemrushBot 1;
    ~*AhrefsBot 1;
    ~*MJ12bot 1;
    ~*DotBot 1;
    ~*PetalBot 1;
    ~*ZoominfoBot 1;
}

server {
    listen       80;
    server_name  _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/release-header.inc;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    if ($blocked_ua) {
        return 403;
    }

    # Common vulnerability-scanner probe paths. Reject outright instead of
    # falling through to the SPA shell, which would otherwise return a
    # misleading 200.
    location ~* /\.(?:env|git|htpasswd|htaccess|aws)(?:/|$) {
        return 403;
    }

    location ~* ^/(?:wp-login\.php|wp-admin|xmlrpc\.php|phpmyadmin|\.vscode|\.idea)(?:/|$) {
        return 403;
    }

    # The SPA shell and runtime config should not be cached by browsers.
    location = / {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Built assets are content-addressed and safe to cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Public static files may be cached, but should never fall back to the SPA shell.
    location ~* \.(?:svg|png|jpg|jpeg|gif|ico|webp|txt)$ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Optional API proxy (UPSTREAM_API_PROXY_URL) and always-present Tapis proxy.
    # Glob includes silently match nothing when files are absent.
    include /etc/nginx/conf.d/api-proxy.inc*;
    include /etc/nginx/conf.d/tapis-proxy.inc*;

    # Serve built files directly when present, otherwise fall back to index.html
    # so client-side routing (SPA) works when navigating directly to routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Expose a friendly error page if present
    location = /error.html {
      internal;
      root /usr/share/nginx/html;
    }
}
